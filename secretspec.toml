[project]
name = "xo-nixpkg"
revision = "1.0"
require_reason = "agents"

[providers]
github-repository = "env"
github-organization = "env"

# Default and development are safe to resolve into a local Nix evaluation.
[profiles.default]
XO_AUTHORITY_WAKEUPS_VALIDATED = { description = "Retire legacy review observer work only after protected hosted authority-to-queue validation", required = false, default = "false", providers = ["github-repository"] }
XO_NIXPKG_AUDIT_NIX_BIN = { description = "Daemon-compatible Nix executable captured by the native audit task at runtime", required = false }

[profiles.development]

# Explicit runtime-only credential contract; never select this in devenv.yaml.
[profiles.runtime]
XO_NIXPKG_EXPORT_REUSE_PAYLOAD = { description = "Non-secret runtime export selection, independent of Actions artifact imports; false retains validation and output identity checks", required = false, default = "true", providers = ["github-repository"] }
CACHIX_AUTH_TOKEN = { description = "Cache write credential; only admitted publication jobs may receive it", required = false, providers = ["github-repository"] }
MERGE_QUEUE_TOKEN = { description = "Short-lived repository-scoped merge queue App token, minted at runtime", required = false, providers = ["github-repository"] }
SECAUDIT_CLIENTID = { description = "Read-only audit App client ID for runtime repository administration audit", required = false, providers = ["github-organization"] }
SECAUDIT_PEM = { description = "Read-only audit App private key; never used for decision checks or writes", required = false, providers = ["github-organization"] }
GH_TOKEN = { description = "Runtime API credential; never supplied to candidate builds or Nix evaluation", required = false, providers = ["github-repository"] }
REPOSITORY_READ_TOKEN = { description = "Built-in read-only repository token for checked policy metadata; separate from the administration audit App", required = false, providers = ["github-repository"] }
DECIDER_CLIENT = { description = "Decision writer and review App client ID from the repository variable", required = false, providers = ["github-repository"] }
DECIDER_KEY = { description = "Decision writer and review App private key, restricted to protected controllers", required = false, providers = ["github-repository"] }
DECIDER_APP_ID = { description = "Numeric App integration ID pinned by reviewed decision policy and App-bound checks", required = false, providers = ["github-repository"] }
REGISTRY_TOKEN = { description = "Scoped built-in GitHub token used for private evidence package authentication and privacy checks", required = false, providers = ["github-repository"] }

[profiles.github-publish]
CACHIX_AUTH_TOKEN = { description = "Cache write credential; only admitted publication jobs may receive it", required = true, providers = ["github-repository"] }
GH_TOKEN = { description = "Runtime API credential; never supplied to candidate builds or Nix evaluation", required = true, providers = ["github-repository"] }

[profiles.github-authority]
DECIDER_CLIENT = { description = "Decision writer and review App client ID from the repository variable", required = true, providers = ["github-repository"] }
DECIDER_KEY = { description = "Decision writer and review App private key, restricted to protected controllers", required = true, providers = ["github-repository"] }
DECIDER_APP_ID = { description = "Numeric App integration ID pinned by reviewed decision policy and App-bound checks", required = true, providers = ["github-repository"] }

[profiles.github-audit]
SECAUDIT_CLIENTID = { description = "Read-only audit App client ID for runtime repository administration audit", required = true, providers = ["github-organization"] }
SECAUDIT_PEM = { description = "Read-only audit App private key; never used for decision checks or writes", required = true, providers = ["github-organization"] }

[profiles.github]
GH_TOKEN = { description = "Runtime API credential; never supplied to candidate builds or Nix evaluation", required = false, providers = ["github-repository"] }
CACHIX_AUTH_TOKEN = { description = "Cache write credential; only admitted publication jobs may receive it", required = false, providers = ["github-repository"] }
