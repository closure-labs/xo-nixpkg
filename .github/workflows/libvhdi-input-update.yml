name: Validate pinned libvhdi input

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            extra-substituters = https://libvhdi-nixpkg.cachix.org
            extra-trusted-public-keys = libvhdi-nixpkg.cachix.org-1:HvYHKZcfczn2nGfCmd7F21E/MDZrlaXtN3p9mWAZT/4=

      - name: Setup Cachix (optional)
        if: vars.CACHIX_CACHE_NAME != ''
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
        continue-on-error: true

      - name: Validate pinned libvhdi release
        run: |
          set -euo pipefail

          expected_ref="refs/tags/20251119"
          expected_rev="c728fa206c74c8dd92cdcc4df2e545425cf148f2"
          locked_ref="$(jq -r '.nodes.libvhdi.locked.ref' flake.lock)"
          locked_rev="$(jq -r '.nodes.libvhdi.locked.rev' flake.lock)"

          if [ "$locked_ref" != "$expected_ref" ]; then
            echo "Expected libvhdi ref $expected_ref, got $locked_ref" >&2
            exit 1
          fi

          if [ "$locked_rev" != "$expected_rev" ]; then
            echo "Expected libvhdi rev $expected_rev, got $locked_rev" >&2
            exit 1
          fi

          nix eval --raw .#packages.x86_64-linux.libvhdi.name
          test "$(nix eval --raw .#packages.x86_64-linux.libvhdi.fuseBackend)" = fuse2
          nix build --no-link --max-jobs 0 .#libvhdi \
            --option extra-substituters 'https://libvhdi-nixpkg.cachix.org' \
            --option extra-trusted-public-keys 'libvhdi-nixpkg.cachix.org-1:HvYHKZcfczn2nGfCmd7F21E/MDZrlaXtN3p9mWAZT/4='
