# SPDX-License-Identifier: Apache-2.0
name: Refresh libvhdi source

on:
  schedule:
    - cron: "41 9 * * 0"
  workflow_dispatch:

concurrency:
  group: libvhdi-source-refresh
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Refresh npins libvhdi release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}

      - name: Refresh and validate the official release asset pin
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nix run .#update-libvhdi -- "$GITHUB_OUTPUT"

      - name: Open the update pull request
        if: steps.release.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: update/libvhdi-${{ steps.release.outputs.version }}
          UPDATE_TITLE: "libvhdi: update to ${{ steps.release.outputs.version }}"
          UPDATE_BODY: |-
            Automated source-lock refresh to the official libvhdi release asset.

            Validation: `nix run .#update-libvhdi`
        run: nix run .#open-update-pr -- nix/sources/libvhdi.json
