# SPDX-License-Identifier: Apache-2.0
name: Refresh libvhdi source

on:
  schedule:
    - cron: "41 9 * * 0"
  workflow_dispatch:

concurrency:
  group: libvhdi-source-refresh
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    name: Refresh npins libvhdi release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.UPDATE_GITHUB_APP_ID }}
          private-key: ${{ secrets.UPDATE_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}
          magic-cache: "false"

      - name: Refresh and validate the official release asset pin
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nix run .#update-libvhdi -- "$GITHUB_OUTPUT"

      - name: Open the update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: update/libvhdi-${{ steps.release.outputs.version }}
          delete-branch: true
          add-paths: npins/sources.json
          commit-message: "libvhdi: update to ${{ steps.release.outputs.version }}"
          title: "libvhdi: update to ${{ steps.release.outputs.version }}"
          body: |
            Automated npins refresh to the official libvhdi release asset.

            Validation: `nix run .#update-libvhdi`
