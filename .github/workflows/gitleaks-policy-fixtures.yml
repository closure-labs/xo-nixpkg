# SPDX-License-Identifier: Apache-2.0
name: Test secret scanner policy
on:
  pull_request:
    branches: [main]
    paths: [.gitleaks.toml, tests/test_public_cache_key_policy.py, tests/test_gitleaks_setup.py, .github/actions/setup-gitleaks/**, .github/workflows/gitleaks-policy-fixtures.yml]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
jobs:
  fixtures:
    name: Exact public-key exception fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test installer integrity boundaries
        run: python3 -m unittest discover -s tests -p test_gitleaks_setup.py
      - name: Install checksum-pinned fixture scanner
        id: gitleaks
        uses: $/.github/actions/setup-gitleaks
      - name: Test proposed policy without changing authoritative scan
        env:
          GITLEAKS_BINARY: ${{ steps.gitleaks.outputs.binary }}
        run: |
          set -euo pipefail
          sudo systemd-run --quiet --wait --pipe --collect --service-type=exec \
            --unit="xo-key-policy-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --uid="$(id -u)" --gid="$(id -g)" --working-directory="$GITHUB_WORKSPACE" \
            --property=MemoryMax=3221225472 --property=MemorySwapMax=0 \
            --property=CPUQuota=100% --property=TasksMax=128 --property=RuntimeMaxSec=120 \
            --property=NoNewPrivileges=true --property=ProtectSystem=strict \
            --property=PrivateTmp=true --property=PrivateNetwork=true --property=ProtectControlGroups=true \
            --property=UMask=0077 --property=KillMode=control-group \
            --setenv=PATH=/usr/local/bin:/usr/bin:/bin \
            --setenv="GITLEAKS_BINARY=$GITLEAKS_BINARY" \
            /usr/bin/timeout --signal=TERM --kill-after=5s 110s \
            /usr/bin/python3 -m unittest discover -s tests -p test_public_cache_key_policy.py
