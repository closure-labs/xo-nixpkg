# SPDX-License-Identifier: Apache-2.0
name: Refresh flake inputs

on:
  schedule:
    - cron: "23 9 * * 0"
  workflow_dispatch:

concurrency:
  group: weekly-flake-input-refresh
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    name: Refresh Nixpkgs
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Audit runner traffic
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Nix
        uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository] -- setup follows the explicitly checked-out source; repair jobs use a trusted base revision.
        with:
          github-token: ${{ github.token }}

      - name: Refresh and validate Nixpkgs
        id: update
        run: nix run .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' update:flake-lock

      - name: Realize trusted candidate closures locally
        if: steps.update.outputs.changed == 'true'
        id: prewarm
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: nix run .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' update:runtime-realize

      - name: Retain prewarm evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xo-prewarm-evidence
          path: ${{ runner.temp }}/xo-nixpkg-ci-evidence
          if-no-files-found: ignore
          retention-days: 30

      - name: Open the lock update pull request
        if: always() && steps.update.outputs.changed == 'true'
        env:
          UPDATE_DRAFT: ${{ steps.prewarm.outcome != 'success' }}
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/weekly-flake-input-refresh
          UPDATE_TITLE: "flake.lock: refresh nixpkgs"
          UPDATE_BODY: Automated weekly refresh of the Nixpkgs flake input.
          XO_NIXPKG_UPDATE_PATHS: flake.lock devenv.lock
        run: nix run .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' update:open-pr

      - name: Fail after retaining a broken candidate
        if: always() && steps.update.outputs.changed == 'true' && steps.prewarm.outcome != 'success'
        run: nix run .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' update:rolling-failure
