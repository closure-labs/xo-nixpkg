# SPDX-License-Identifier: Apache-2.0
name: Refresh flake inputs

on:
  schedule:
    - cron: "23 9 * * 0"
  workflow_dispatch:

concurrency:
  group: weekly-flake-input-refresh
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    name: Refresh Nixpkgs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}

      - name: Refresh and validate Nixpkgs
        id: update
        run: nix run .#update-flake-lock -- "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        if: steps.update.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.UPDATE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.UPDATE_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open the lock update pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          UPDATE_BRANCH: automation/weekly-flake-input-refresh
          UPDATE_TITLE: "flake.lock: refresh nixpkgs"
          UPDATE_BODY: Automated weekly refresh of the Nixpkgs flake input.
        run: nix run .#open-update-pr -- flake.lock
