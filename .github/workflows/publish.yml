# SPDX-License-Identifier: Apache-2.0
name: Publish admitted products
run-name: ${{ format('Publish {0} qualification {1} attempt {2}', inputs.purpose, inputs.qualification_run, inputs.qualification_attempt || 'current') }}
on:
  workflow_dispatch:
    inputs:
      qualification_run:
        description: Successful immutable qualification run ID
        type: string
        required: true
      qualification_attempt:
        description: Expected qualification attempt; empty resolves the current successful attempt
        type: string
        required: false
      purpose:
        description: Publication authority required
        type: choice
        options: [rolling, release]
        default: rolling
permissions:
  contents: read
  actions: read
  attestations: read
  packages: write
concurrency:
  group: publication-${{ github.repository }}
  queue: max
  cancel-in-progress: false
jobs:
  publish:
    name: Verify live admission and publish exact immutable outputs
    if: github.repository == 'closure-labs/xo-nixpkg' && github.ref == 'refs/heads/main'
    environment: publication
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
      attestations: read
      packages: write
    env:
      XO_NIXPKG_EVIDENCE: security-evidence
      XO_NIXPKG_PUBLICATION_PURPOSE: ${{ inputs.purpose }}
      QUALIFICATION_RUN: ${{ inputs.qualification_run }}
      QUALIFICATION_ATTEMPT: ${{ inputs.qualification_attempt }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Audit runner traffic
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - name: Checkout protected controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Nix
        uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository] -- setup follows the explicitly checked-out source; repair jobs use a trusted base revision.
        with:
          github-token: ${{ github.token }}
      - name: Mint repository-scoped native observer (read only)
        id: native_observer
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          owner: closure-labs
          repositories: xo-nixpkg
          permission-administration: read
          permission-secret-scanning-alerts: read
      - name: Mint repository-scoped publication authority token
        id: publisher
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: read
          permission-actions: read
          permission-administration: read
          permission-members: read
      - name: Download and verify qualified evidence
        env:
          NATIVE_SECRET_OBSERVER_TOKEN: ${{ steps.native_observer.outputs.token }}
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          XO_NIXPKG_PUBLICATION_METADATA_ONLY: 'true'
        run: nix run .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' release:fetch
      - name: Recheck admission and publish exact closures
        env:
          NATIVE_SECRET_OBSERVER_TOKEN: ${{ steps.native_observer.outputs.token }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: nix run .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' release:resume
      - name: Retain immutable decision byte reuse observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xo-decision-byte-reuse-${{ github.job }}
          path: ${{ runner.temp }}/decision-git-blobs/*/observations.jsonl
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain exact publication operation summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xo-publication-result
          path: ${{ runner.temp }}/publication-result.json
          if-no-files-found: ignore
          retention-days: 30
