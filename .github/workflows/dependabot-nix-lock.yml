# SPDX-License-Identifier: Apache-2.0
name: Synchronize native lock for Dependabot
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: dependabot-nix-lock-main
  cancel-in-progress: false
jobs:
  synchronize:
    if: github.repository == 'closure-labs/xo-nixpkg' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_BASE: ${{ github.sha }}
      REPOSITORY_READ_TOKEN: ${{ github.token }}
    steps:
      - name: Audit runner traffic
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - name: Checkout protected controller only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Discover and validate one exact JSON-only lock update
        id: plan
        run: python3 ci/sync-dependabot-lock.py --discover
      - name: Mint scoped Decider writer after read-only validation
        if: steps.plan.outputs.changed == 'true'
        id: writer
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: xo-nixpkg
          permission-contents: write
      - name: Revalidate and atomically synchronize only devenv.lock
        if: steps.plan.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.writer.outputs.token }}
          PR_NUMBER: ${{ steps.plan.outputs.number }}
          EXPECTED_HEAD: ${{ steps.plan.outputs.head }}
        run: python3 ci/sync-dependabot-lock.py --write
