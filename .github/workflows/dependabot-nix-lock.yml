# SPDX-License-Identifier: Apache-2.0
name: Synchronize native lock for Dependabot
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: dependabot-nix-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  synchronize:
    if: >-
      github.repository == 'closure-labs/xo-nixpkg' &&
      github.event.pull_request.user.id == 49699333 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/nix/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      REPOSITORY_READ_TOKEN: ${{ github.token }}
    steps:
      - name: Audit runner traffic
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - name: Checkout protected controller only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Validate exact JSON-only lock update
        id: plan
        run: python3 ci/sync-dependabot-lock.py
      - name: Mint scoped Decider writer after read-only validation
        if: steps.plan.outputs.changed == 'true'
        id: writer
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Revalidate and atomically synchronize only devenv.lock
        if: steps.plan.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.writer.outputs.token }}
        run: python3 ci/sync-dependabot-lock.py --write
