# SPDX-License-Identifier: Apache-2.0
name: Verify maintainer decision authority
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] Metadata only; trusted main executes.
    workflows: [Collect maintainer decision events]
    types: [completed]
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: authority-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  authority:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Audit runner traffic
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - name: Checkout protected controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository] -- local setup follows the explicitly checked-out trusted revision.
        with:
          github-token: ${{ github.token }}
      - name: Mint repository-scoped authority token
        id: authority
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
          permission-actions: read
          permission-administration: read
          permission-members: read
      - name: Authenticate live human authority
        env:
          GH_TOKEN: ${{ steps.authority.outputs.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          COLLECTOR_RUN: ${{ github.event.workflow_run.id }}
        run: nix run .#devenv -- tasks run security:authority
