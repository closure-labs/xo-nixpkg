# SPDX-License-Identifier: Apache-2.0
name: Refresh XO rolling channel

on:
  schedule:
    if: github.repository == 'closure-labs/xo-nixpkg'
    - cron: "40 6 * * *"
  workflow_dispatch:
    if: github.repository == 'closure-labs/xo-nixpkg'

concurrency:
  group: xo-rolling-update
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    if: github.repository == 'closure-labs/xo-nixpkg' && (github.ref == 'refs/heads/main')
    name: Refresh upstream HEAD candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Audit runner traffic
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository] -- setup follows the explicitly checked-out source; repair jobs use a trusted base revision.
        with:
          github-token: ${{ github.token }}

      - name: Refresh the rolling source and dependency locks
        id: rolling
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nix run .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' update:xo-rolling

      - name: Realize the exact rolling candidate locally
        if: steps.rolling.outputs.changed == 'true'
        id: prewarm
        continue-on-error: true
        run: nix run .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' update:rolling-realize

      - name: Open or update the rolling candidate pull request
        if: always() && steps.rolling.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/xo-rolling
          UPDATE_TITLE: "xen-orchestra-ce rolling: refresh upstream"
          UPDATE_DRAFT: ${{ steps.prewarm.outcome != 'success' }}
          UPDATE_BODY: |-
            Automated rolling-channel candidate from Xen Orchestra upstream master.

            Upstream commit: `vatesfr/xen-orchestra@${{ steps.rolling.outputs.rev }}`
            Changed channels: `${{ steps.rolling.outputs.changed_channels }}`
            Candidate realization status: `${{ steps.prewarm.outcome == 'success' && 'realized locally' || 'BROKEN — realization failed' }}`

            The normal pull-request CI is authoritative. A realized locally candidate is
            eligible for the trusted merge queue; a broken candidate remains draft
            and is replaced only when upstream advances.
          XO_NIXPKG_UPDATE_PATHS: flake.nix flake.lock nix/sources/xen-orchestra.json
        run: nix run .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' update:open-pr

      - name: Fail after preserving a broken rolling candidate
        if: always() && steps.rolling.outputs.changed == 'true' && steps.prewarm.outcome != 'success'
        run: nix run .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' update:rolling-failure
