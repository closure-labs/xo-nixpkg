name: Check for XO release updates

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run update detection and validation without creating a pull request"
        required: false
        default: false
        type: boolean

jobs:
  check-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix (optional)
        if: vars.CACHIX_CACHE_NAME != ''
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
        continue-on-error: true

      - name: Run updater script
        run: |
          chmod +x ./scripts/update.sh
          ./scripts/update.sh --release

      - name: Detect changes
        id: detect
        run: |
          if git diff --quiet -- default.nix; then
            echo "update_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          new_version=$(grep 'version = ' default.nix | sed 's/.*version = "\([^"]*\)".*/\1/')
          new_rev=$(grep 'rev = ' default.nix | sed 's/.*rev = "\([a-f0-9]*\)".*/\1/')

          {
            echo "update_available=true"
            echo "new_version=$new_version"
            echo "new_rev=$new_rev"
            echo "branch_name=update/xen-orchestra-ce-$new_version"
          } >> "$GITHUB_OUTPUT"

      - name: Validate updated package
        if: steps.detect.outputs.update_available == 'true'
        run: |
          for attempt in 1 2 3; do
            if nix build .#xen-orchestra-ce -L; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "xen-orchestra-ce update validation failed after $attempt attempts" >&2
              exit 1
            fi

            echo "Retrying xen-orchestra-ce update validation after transient failure (attempt $attempt failed)..." >&2
            sleep $((attempt * 15))
          done

      - name: Push validated package result to Cachix
        if: steps.detect.outputs.update_available == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true') && vars.CACHIX_CACHE_NAME != ''
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CACHIX_AUTH_TOKEN:-}" ]; then
            echo "CACHIX_AUTH_TOKEN is not configured; skipping Cachix push."
            exit 0
          fi

          out_path=$(readlink -f result)
          echo "Pushing built package output: $out_path"
          printf '%s\n' "$out_path" | cachix push "${{ vars.CACHIX_CACHE_NAME }}"

      - name: Create GitHub App token
        id: app_token
        if: steps.detect.outputs.update_available == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true')
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.UPDATE_GITHUB_APP_ID }}
          private-key: ${{ secrets.UPDATE_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Pull Request
        id: create_pr
        if: steps.detect.outputs.update_available == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true') && steps.app_token.outcome == 'success'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app_token.outputs.token }}
          commit-message: "xen-orchestra-ce: update to ${{ steps.detect.outputs.new_version }}"
          title: "xen-orchestra-ce: update to ${{ steps.detect.outputs.new_version }}"
          body: |
            Automated update to xen-orchestra-ce ${{ steps.detect.outputs.new_version }}.

            Changes include:
            - `version`
            - `src.rev`
            - `src.hash`
            - `yarnOfflineCache.hash`

            Upstream commit: vatesfr/xen-orchestra@${{ steps.detect.outputs.new_rev }}

            Validation:
            - `nix build .#xen-orchestra-ce -L`
            - the validated `result` output is pushed to Cachix when `CACHIX_CACHE_NAME` and `CACHIX_AUTH_TOKEN` are configured
          branch: ${{ steps.detect.outputs.branch_name }}
          add-paths: |
            default.nix
          delete-branch: true

      - name: Report PR result
        if: steps.detect.outputs.update_available == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true')
        run: |
          branch_name="${{ steps.detect.outputs.branch_name }}"
          compare_url="https://github.com/${{ github.repository }}/compare/main...${branch_name}?expand=1"
          pull_url="https://github.com/${{ github.repository }}/pull/new/${branch_name}"

          if [ "${{ steps.app_token.outcome }}" != "success" ]; then
            {
              echo "GitHub App token creation failed."
              echo ""
              echo "Configure the GitHub App credentials before rerunning this workflow:"
              echo "- Variable: \`UPDATE_GITHUB_APP_ID\`"
              echo "- Secret: \`UPDATE_GITHUB_APP_PRIVATE_KEY\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::GitHub App token creation failed. Verify UPDATE_GITHUB_APP_ID, UPDATE_GITHUB_APP_PRIVATE_KEY, and the app installation."
          elif [ "${{ steps.create_pr.outcome }}" = "success" ]; then
            echo "Automated pull request step succeeded." >> "$GITHUB_STEP_SUMMARY"
            if [ -n "${{ steps.create_pr.outputs.pull-request-url }}" ]; then
              {
                echo ""
                echo "Pull request: ${{ steps.create_pr.outputs.pull-request-url }}"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            {
              echo "Automated pull request creation is not permitted in this repository."
              echo ""
              echo "The update branch was pushed successfully and is ready for manual review."
              echo ""
              echo "- Branch: \`${branch_name}\`"
              echo "- Open PR: ${pull_url}"
              echo "- Compare diff: ${compare_url}"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Automatic pull request creation was blocked. Open a PR manually from ${pull_url}"
          fi

      - name: Report dry run result
        if: steps.detect.outputs.update_available == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        run: |
          echo "Dry run detected an available xen-orchestra-ce update to ${{
            steps.detect.outputs.new_version
          }}."
          echo "Validation succeeded and no pull request was created."
