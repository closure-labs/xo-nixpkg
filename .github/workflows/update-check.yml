# SPDX-License-Identifier: Apache-2.0
name: Check for XO release updates

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: xo-release-update
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    name: Refresh Xen Orchestra release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.UPDATE_GITHUB_APP_ID }}
          private-key: ${{ secrets.UPDATE_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}
          magic-cache: "false"

      - name: Update and validate the selected release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nix run .#update-xo-release -- "$GITHUB_OUTPUT"

      - name: Open the update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: update/xen-orchestra-ce-${{ steps.release.outputs.version }}
          delete-branch: true
          add-paths: |
            default.nix
            nix/platform-tools.nix
          commit-message: "xen-orchestra-ce: update to ${{ steps.release.outputs.version }}"
          title: "xen-orchestra-ce: update to ${{ steps.release.outputs.version }}"
          body: |
            Automated update to Xen Orchestra ${{ steps.release.outputs.version }}.

            Upstream commit: `vatesfr/xen-orchestra@${{ steps.release.outputs.rev }}`

            Validation: `nix run .#update-xo-release`
