# SPDX-License-Identifier: Apache-2.0
name: Check for XO release updates

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: xo-release-update
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Refresh Xen Orchestra release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}

      - name: Refresh the official release channels
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nix run .#update-xo-release -- "$GITHUB_OUTPUT"

      - name: Open the update pull request
        if: steps.release.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/xo-release-channels
          UPDATE_TITLE: "xen-orchestra-ce channels: refresh official releases"
          UPDATE_BODY: |-
            Automated refresh of the latest and stable Xen Orchestra release outputs.

            Upstream commit: `vatesfr/xen-orchestra@${{ steps.release.outputs.rev }}`
            Changed channels: `${{ steps.release.outputs.changed_channels }}`

            Pull-request CI builds only the affected channel outputs before this can merge.
        run: nix run .#open-update-pr -- flake.nix flake.lock nix/sources/xen-orchestra.json
