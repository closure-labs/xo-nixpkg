# SPDX-License-Identifier: Apache-2.0
name: Prewarm protected runtime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-prewarm-${{ github.repository }}
  queue: max

jobs:
  prewarm:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout the exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Nix
        uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository] -- setup follows the explicitly checked-out protected source.
        with:
          github-token: ${{ github.token }}
      - name: Prewarm the protected runtime
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: nix run .#devenv -- tasks run update:runtime-realize
      - name: Retain prewarm evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xo-prewarm-evidence
          path: ${{ runner.temp }}/xo-nixpkg-ci-evidence
          if-no-files-found: ignore
          retention-days: 30
