# SPDX-License-Identifier: Apache-2.0
name: Classify diagnostic scanner findings
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diagnostic-secret-triage.yml
      - ci/diagnostic-secret-triage.py
      - tests/test_diagnostic_secret_triage.py
permissions:
  contents: read
jobs:
  classify:
    if: github.repository == 'closure-labs/xo-nixpkg' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'diagnostic/retained-nar-comparison'
    name: Redacted finding locations
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate metadata sanitizer
        run: python3 -m unittest discover -s tests -p test_diagnostic_secret_triage.py
      - name: Install pinned upstream scanner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/triage-gitleaks"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 60 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/triage-gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/triage-gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/triage-gitleaks.tar.gz" -C "$RUNNER_TEMP/triage-gitleaks" gitleaks
          test "$("$RUNNER_TEMP/triage-gitleaks/gitleaks" version)" = 8.30.1
      - name: Emit finding locations only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          umask 077
          timeout --signal=TERM --kill-after=5s 120s python3 ci/diagnostic-secret-triage.py "$RUNNER_TEMP/triage-gitleaks/gitleaks"
