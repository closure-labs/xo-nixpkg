# SPDX-License-Identifier: Apache-2.0
name: Classify diagnostic scanner findings
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diagnostic-secret-triage.yml
      - ci/diagnostic-secret-triage.py
      - tests/test_diagnostic_secret_triage.py
permissions:
  contents: read
jobs:
  classify:
    if: github.repository == 'closure-labs/xo-nixpkg' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'diagnostic/retained-nar-comparison'
    name: Redacted finding locations
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate metadata sanitizer
        run: python3 -m unittest discover -s tests -p test_diagnostic_secret_triage.py
      - name: Install pinned upstream scanner
        id: gitleaks
        uses: ./.github/actions/setup-gitleaks
      - name: Emit finding locations only
        env:
          GITLEAKS_BINARY: ${{ steps.gitleaks.outputs.binary }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          umask 077
          # A real memory cgroup allows Go virtual reservations without raising RAM.
          sudo systemd-run --quiet --wait --pipe --collect --service-type=exec \
            --unit="xo-secret-triage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --uid="$(id -u)" --gid="$(id -g)" --working-directory="$GITHUB_WORKSPACE" \
            --property=MemoryMax=3221225472 --property=MemorySwapMax=0 \
            --property=CPUQuota=100% --property=TasksMax=128 --property=RuntimeMaxSec=120 \
            --property=NoNewPrivileges=true --property=ProtectSystem=strict \
            --property=PrivateTmp=true --property=PrivateNetwork=true --property=ProtectControlGroups=true \
            --property=UMask=0077 --property=KillMode=control-group \
            --setenv="BASE_SHA=$BASE_SHA" --setenv="HEAD_SHA=$HEAD_SHA" \
            --setenv=GITHUB_ACTIONS=true --setenv=GITHUB_REPOSITORY=closure-labs/xo-nixpkg \
            --setenv=PATH=/usr/local/bin:/usr/bin:/bin \
            /usr/bin/timeout --signal=TERM --kill-after=5s 110s \
            /usr/bin/python3 ci/diagnostic-secret-triage.py "$GITLEAKS_BINARY"
