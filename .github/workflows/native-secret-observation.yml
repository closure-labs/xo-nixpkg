# SPDX-License-Identifier: Apache-2.0
name: Observe native repository secrets
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] Protected-main metadata only; no candidate checkout or execution.
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-secret-observation-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false
jobs:
  observe:
    if: github.repository == 'closure-labs/xo-nixpkg' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: write
    env:
      # Final migration only: the separate bootstrap must hardcode bootstrap.
      OBSERVER_MODE: production
      SOURCE_RUN: ${{ github.event.workflow_run.id || '' }}
    steps:
      - name: Checkout protected controller only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Authenticate immutable event scope before accessing observer credential
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ -n "$SOURCE_RUN" ]]; then args+=(--run-id "$SOURCE_RUN"); fi
          python3 ci/native-secret-controller.py scope --output "$RUNNER_TEMP/native-secret-observation.json" "${args[@]}"
      - name: Mint repository-scoped read-only observer
        id: observer
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          owner: closure-labs
          repositories: xo-nixpkg
          permission-administration: read
          permission-secret-scanning-alerts: read
      - name: Collect posture and hidden-secret alert observation
        id: collect
        if: steps.observer.outcome == 'success'
        continue-on-error: true
        env:
          NATIVE_SECRET_OBSERVER_TOKEN: ${{ steps.observer.outputs.token }}
          REPOSITORY_READ_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ -n "$SOURCE_RUN" ]]; then args+=(--run-id "$SOURCE_RUN"); fi
          python3 ci/native-secret-controller.py collect --output "$RUNNER_TEMP/native-secret-observation.json" "${args[@]}"
      - name: Publish separate GitHub Actions-owned observation check
        if: always() && steps.scope.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ -n "$SOURCE_RUN" ]]; then args+=(--run-id "$SOURCE_RUN"); fi
          python3 ci/native-secret-controller.py check --observer-mode "$OBSERVER_MODE" --output "$RUNNER_TEMP/native-secret-observation.json" "${args[@]}"
      - name: Retain only validated observation metadata
        if: steps.collect.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-secret-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-secret-observation.json
          if-no-files-found: error
          retention-days: 7
