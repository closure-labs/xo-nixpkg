# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

permissions:
  contents: read

jobs:
  classify:
    name: Classify CI paths
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      workflow: ${{ steps.classify.outputs.workflow }}
    steps:
      - name: Checkout classification history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && '0' || '1' }}
          persist-credentials: false

      - name: Classify the event
        id: classify
        run: bash ci/classify.sh "$GITHUB_OUTPUT"

  validate:
    name: Flake-defined validation
    needs: classify
    if: >-
      needs.classify.result == 'success' &&
      fromJSON(needs.classify.outputs.workflow).jobs.validate.enabled
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PREPARED_CI_WORKFLOW: ${{ needs.classify.outputs.workflow }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix and cache
        uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}

      - name: Run the selected flake-defined targets
        run: nix run .#ci

  gate:
    name: CI gate
    if: always()
    needs: [classify, validate]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      CLASSIFY_RESULT: ${{ needs.classify.result }}
      VALIDATE_RESULT: ${{ needs.validate.result }}
      VALIDATE_ENABLED: ${{ needs.classify.result == 'success' && fromJSON(needs.classify.outputs.workflow).jobs.validate.enabled || false }}
    steps:
      - name: Enforce the classified lifecycle
        run: |
          test "$CLASSIFY_RESULT" = success
          if test "$VALIDATE_ENABLED" = true; then
            test "$VALIDATE_RESULT" = success
          else
            test "$VALIDATE_RESULT" = skipped
          fi
