# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare Nix CI workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      workflow: ${{ steps.workflow.outputs.workflow }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix and cache
        uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}

      - name: Prepare the Nix-defined workflow
        id: workflow
        run: nix run .#prepare-ci -- "$GITHUB_OUTPUT"

  validate:
    name: Flake-defined validation
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PREPARED_CI_WORKFLOW: ${{ needs.prepare.outputs.workflow }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix and cache
        uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}

      - name: Run the complete flake-defined pipeline
        run: nix run .#ci

  publish:
    name: Publish prepared package closures
    needs: [prepare, validate]
    if: >-
      needs.prepare.result == 'success' &&
      needs.validate.result == 'success' &&
      fromJSON(needs.prepare.outputs.workflow).jobs.publish.enabled
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PREPARED_CI_WORKFLOW: ${{ needs.prepare.outputs.workflow }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix and cache
        uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}

      - name: Publish prepared package closures
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: nix run .#publish

  gate:
    name: CI gate
    if: always()
    needs: [prepare, validate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI_JOB_RESULTS: ${{ toJSON(needs) }}
      PREPARED_CI_WORKFLOW: ${{ needs.prepare.outputs.workflow }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}

      - name: Enforce the prepared Nix gate
        run: nix run .#ci-gate

  tag:
    name: Tag gated main release and aliases
    if: >-
      needs.gate.result == 'success' &&
      fromJSON(needs.prepare.outputs.workflow).release.enabled
    needs: [prepare, gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.UPDATE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.UPDATE_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout the gated commit and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}

      - name: Create tags from the gated SHA
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GATED_SHA: ${{ github.sha }}
        run: nix run .#tag-release

      - name: Publish the immutable GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: nix run .#publish-release
