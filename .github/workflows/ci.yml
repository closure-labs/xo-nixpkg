# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Flake-defined validation
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix and cache
        uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}

      - name: Run the complete flake-defined pipeline
        run: nix run .#ci

  gate:
    name: CI gate
    if: always()
    needs: validate
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require validation success
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATE_RESULT" = success

  publish:
    name: Publish protected-main package closures
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}
          magic-cache: "false"

      - name: Publish the flake's final closures
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: nix run .#publish

  tag:
    name: Tag gated main release and aliases
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.UPDATE_GITHUB_APP_ID }}
          private-key: ${{ secrets.UPDATE_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout the gated commit and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}
          magic-cache: "false"

      - name: Create tags from the gated SHA
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GATED_SHA: ${{ github.sha }}
        run: nix run .#tag-release

      - name: Publish the immutable GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: nix run .#publish-release
