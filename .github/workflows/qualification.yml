# SPDX-License-Identifier: Apache-2.0
name: Qualify immutable products
on:
  push:
    branches: [main]
    paths-ignore: ['automation/decisions/**', 'docs/**', '*.md']
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      qualification_run:
        description: Optional retained product run to refresh without changing release identity
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: product-qualification
  cancel-in-progress: false
jobs:
  qualify:
    name: Build and scan all distributed profiles
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: write
      id-token: write
    steps:
      - name: Audit runner traffic
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - name: Checkout immutable producer revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository] -- local setup follows the explicitly checked-out trusted revision.
        with:
          github-token: ${{ github.token }}
      - name: Fetch authenticated retained product for rescan
        if: github.event_name == 'schedule' || inputs.qualification_run != ''
        env:
          QUALIFICATION_RUN: ${{ inputs.qualification_run }}
          GH_TOKEN: ${{ github.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          XO_NIXPKG_FETCH_FOR_RESCAN: 'true'
          XO_NIXPKG_EVIDENCE: retained-product
        run: nix run .#devenv -- tasks run security:fetch-rescan
      - name: Refresh exact retained product with current trusted scanner
        if: github.event_name == 'schedule' || inputs.qualification_run != ''
        env:
          XO_NIXPKG_RESCAN_SOURCE: retained-product
        run: nix run .#devenv -- tasks run security:refresh
      - name: Build complete runtime inventories and scan fresh databases
        if: github.event_name != 'schedule' && inputs.qualification_run == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix run .#devenv -- tasks run security:qualify
      - name: Attest candidate, observations and independent handoffs
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            security-evidence/scans.json
            security-evidence/product.json
            security-evidence/handoff-*.json
      - name: Retain candidate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualified-products-${{ github.run_id }}-${{ github.run_attempt }}
          path: security-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
