# SPDX-License-Identifier: Apache-2.0
name: Queue trusted automation updates

on:
  schedule:
    - cron: "7 10 * * *"
  workflow_dispatch:

concurrency:
  group: queue-automation
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  enqueue:
    name: Validate and enqueue trusted updates
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}

      - name: Verify author, repository, branch, title, and SHA before auto-merge
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN || github.token }}
          UPDATE_AUTHOR: github-actions
        run: nix run .#queue-automation
