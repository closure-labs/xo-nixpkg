# SPDX-License-Identifier: Apache-2.0
name: Queue trusted automation updates

on:
  # Event data never selects code or artifacts; the trusted main controller
  # revalidates current candidate identity, SHA, paths, approval and CI itself.
  workflow_run: # zizmor: ignore[dangerous-triggers] -- observer completion only wakes trusted-main reconciliation.
    workflows:
      - Validate packages
      - Verify merge approval
      - Relay update reviews
      - Check for XO release updates
      - Refresh XO rolling channel
      - Refresh libvhdi source
    types: [completed]
  schedule:
    - cron: "7 10 * * *"
  workflow_dispatch:

concurrency:
  group: queue-automation
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  enqueue:
    if: github.repository == 'closure-labs/xo-nixpkg' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.name != 'Relay update reviews' || vars.XO_AUTHORITY_WAKEUPS_VALIDATED != 'true'))))
    name: Reconcile trusted updates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Audit runner traffic
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - name: Checkout trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main

      - name: Set up Nix
        uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository] -- setup follows the explicitly checked-out source; repair jobs use a trusted base revision.
        with:
          github-token: ${{ github.token }}

      - name: Mint repository-scoped queue token
        id: queue
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: write

      - name: Preflight merge-queue credential
        env:
          GH_TOKEN: ${{ steps.queue.outputs.token }}
        run: nix run .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' update:queue-preflight

      - name: Verify author, repository, branch, title, and SHA before auto-merge
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ steps.queue.outputs.token }}
          UPDATE_AUTHOR: github-actions
        run: nix run .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' update:queue
