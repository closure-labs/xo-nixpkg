# SPDX-License-Identifier: Apache-2.0
name: Reconcile release decisions
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] Only completed producer metadata and attested data are read.
    workflows: [Qualify release products, Verify merge approval]
    types: [completed]
  push:
    branches: [main]
    paths: ['automation/decisions/**']
  schedule:
    - cron: '31 * * * *'
  workflow_dispatch:
    inputs:
      qualification_run:
        description: Exact historical qualification to reconcile; empty selects the latest successful product
        type: string
        required: false
permissions:
  contents: read
  actions: read
  packages: write
  attestations: read
concurrency:
  group: decision-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'closure-labs/xo-nixpkg' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Audit runner traffic
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2
        with:
          egress-policy: audit
      - name: Checkout protected controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository] -- local setup follows the explicitly checked-out trusted revision.
        with:
          github-token: ${{ github.token }}
      - name: Mint repository-scoped proposal token
        id: proposer
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DECIDER_CLIENT }}
          private-key: ${{ secrets.DECIDER_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: write
          permission-administration: read
          permission-members: read
      - name: Select exact evidence transport
        id: transport
        env:
          XO_NIXPKG_RECONCILE_PLAN_ONLY: 'true'
          GH_TOKEN: ${{ steps.proposer.outputs.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN: ${{ inputs.qualification_run || (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Qualify release products' && github.event.workflow_run.id) || '' }}
          QUALIFICATION_ATTEMPT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Qualify release products' && github.event.workflow_run.run_attempt || '' }}
        run: nix run .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' security:resume
      - name: Download complete exact-run products
        id: products
        if: steps.transport.outputs.artifact_id != ''
        # Streaming extraction and bounded idle retries replace the opaque CLI
        # transfer. Keep the existing ten-minute optional-transport budget.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 10
        continue-on-error: true # Authenticated retained recovery remains available.
        with:
          artifact-ids: ${{ steps.transport.outputs.artifact_id }}
          run-id: ${{ steps.transport.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ runner.temp }}/reconciliation-evidence
      - name: Persist evidence, reconcile proposals and resume admitted candidates
        if: steps.transport.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ steps.proposer.outputs.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN: ${{ steps.transport.outputs.run_id }}
          QUALIFICATION_ATTEMPT: ${{ steps.transport.outputs.attempt }}
          XO_NIXPKG_RECONCILE_DOWNLOAD_OUTCOME: ${{ steps.products.outcome }}
          XO_NIXPKG_RECONCILE_DOWNLOADED_EVIDENCE: ${{ runner.temp }}/reconciliation-evidence
        run: nix run .#devenv -- tasks run --mode single --option 'packages:pkgs!' '' security:resume
      - name: Retain immutable decision byte reuse observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xo-decision-byte-reuse-${{ github.job }}
          path: |
            ${{ runner.temp }}/decision-git-blobs/*/observations.jsonl
            ${{ runner.temp }}/reconciliation-transport.jsonl
          if-no-files-found: ignore
          retention-days: 30
