# SPDX-License-Identifier: Apache-2.0
name: Set up Nix
description: Install pinned Determinate Nix; flake.nix owns the public cache graph

inputs:
  github-token:
    description: GitHub token used by Nix fetchers
    required: true
runs:
  using: composite
  steps:
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      with:
        github-token: ${{ inputs.github-token }}
