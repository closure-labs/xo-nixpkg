# SPDX-License-Identifier: Apache-2.0
name: Set up Nix
description: Install pinned Determinate Nix; flake.nix owns the public cache graph

inputs:
  github-token:
    description: GitHub token used by Nix fetchers
    required: true
runs:
  using: composite
  steps:
    - name: Install Determinate Nix
      uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # installer for v3.21.9
      # Disable action-managed login; select Determinate in the installer itself.
      with:
        determinate: false
        flakehub: false
        extra-args: --determinate
        source-tag: v3.21.9
        github-token: ${{ inputs.github-token }}
        extra-conf: |
          accept-flake-config = true
          substituters = https://cache.nixos.org
    - name: Verify public bootstrap cache
      shell: bash
      run: |
        set -euo pipefail
        # Hash repair must retain Determinate Nixd despite disabling action login.
        command -v determinate-nixd >/dev/null
        # Inspect only this setting: the full config may contain access tokens.
        # Cachix is added by flake.nix when the repository is first evaluated.
        actual=$(nix config show substituters)
        if [[ "$actual" != https://cache.nixos.org ]]; then
          echo 'Unexpected bootstrap substituters; refusing to use an implicit cache' >&2
          exit 1
        fi
