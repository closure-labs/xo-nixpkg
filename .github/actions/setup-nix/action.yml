# SPDX-License-Identifier: Apache-2.0
name: Set up Nix
description: Install pinned Determinate Nix; flake.nix owns the public cache graph

inputs:
  github-token:
    description: GitHub token used by Nix fetchers
    required: true
runs:
  using: composite
  steps:
    - name: Install Determinate Nix
      uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # installer for v3.21.9
      # Disable action-managed login; select Determinate in the installer itself.
      with:
        determinate: false
        flakehub: false
        extra-args: --determinate
        source-tag: v3.21.9
        github-token: ${{ inputs.github-token }}
        extra-conf: |
          accept-flake-config = true
          substituters = https://cache.nixos.org
    - name: Verify public bootstrap cache
      shell: bash
      run: |
        set -euo pipefail
        command -v determinate-nixd >/dev/null
        # Parse privately: the complete config may contain fetch credentials.
        nix config show --json | python3 -c '
        import json, sys
        from urllib.parse import urlsplit
        config = json.load(sys.stdin)
        caches = config.get("substituters", {}).get("value")
        allowed = {"https://cache.nixos.org", "https://cache.nixos.org/"}
        if not isinstance(caches, list) or not caches or any(not isinstance(url, str) or url not in allowed for url in caches):
            hosts = [urlsplit(url).hostname for url in caches if isinstance(url, str)] if isinstance(caches, list) else []
            print("Unexpected bootstrap cache hosts: " + repr(hosts), file=sys.stderr)
            sys.exit(1)
        '
