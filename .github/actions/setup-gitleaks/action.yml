# SPDX-License-Identifier: Apache-2.0
name: Set up pinned Gitleaks
description: Install the checksum-pinned upstream Linux scanner without changing PATH
outputs:
  binary:
    description: Absolute path to the verified scanner
    value: ${{ steps.install.outputs.binary }}
runs:
  using: composite
  steps:
    - name: Verify and install upstream scanner
      id: install
      shell: bash
      run: |
        set -euo pipefail
        destination=$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")
        curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 60 \
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
          -o "$destination/archive.tar.gz"
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $destination/archive.tar.gz" | sha256sum --check --status
        tar -xzf "$destination/archive.tar.gz" -C "$destination" gitleaks
        test "$("$destination/gitleaks" version)" = 8.30.1
        printf 'binary=%s\n' "$destination/gitleaks" >> "$GITHUB_OUTPUT"
